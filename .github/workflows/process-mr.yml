name: process-mr

on:
  pull_request:
  pull_request_review:
    types: [submitted, edited, dismissed]

concurrency:
  group: mr-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-jvm
      - run: just commits origin/${{ github.event.pull_request.base.ref }}

  ktlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew ktlintCheck
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-reports
          path: build/reports/ktlint/
          if-no-files-found: ignore

  detekt:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew verifyNoSuppressions detektMain detektTest detektIntegrationTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/reports/detekt/
          if-no-files-found: ignore

  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew verifyIntegrationTestSourceSetNotEmpty test integrationTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            build/test-results/
            build/reports/tests/
          if-no-files-found: ignore

  jacoco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-jvm
      - run: ./gradlew jacocoTestReport jacocoTestCoverageVerification
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/
          if-no-files-found: ignore

  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  agent-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: scripts/agent-review.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
