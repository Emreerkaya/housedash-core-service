services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: housedash
      POSTGRES_USER: housedash
      POSTGRES_PASSWORD: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housedash"]
      interval: 2s
      timeout: 3s
      retries: 20
